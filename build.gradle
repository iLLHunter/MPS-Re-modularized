tasks.register('curseforge', TaskPublishCurseForge) { task ->
    group = 'publishing'
    description = 'Upload the single MPS Re-modularized artifact to its configured CurseForge project.'
    enabled = releaseUploadsEnabled && curseProject.isPresent() && curseToken.isPresent()
    dependsOn(tasks.named('jar'), outputChangelog)
    disableVersionDetection()
    if (curseProject.isPresent()) {
        apiToken = curseToken.getOrElse('')
        task.upload(Long.parseLong(curseProject.get()), tasks.named('jar')) { artifact ->
            artifact.displayName = "MPS Re-modularized ${mod_version} for ${minecraft_version}"
            artifact.changelog = changelogFile
            artifact.changelogType = 'markdown'
            artifact.releaseType = release_type
            artifact.addModLoader('NeoForge')
            artifact.addJavaVersion("Java ${java_version}")
            artifact.addGameVersion(minecraft_version)
            artifact.addOptional('jei', 'applied-energistics-2', 'scannable')
        }
    }
}

