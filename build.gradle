// Keep active clients independent of subsequent builds replacing build/libs/*.jar.
['PackagedClient': 'packaged-client-a', 'PackagedClientAlt': 'packaged-client-b'].each { runName, folder ->
    def installer = tasks.register("install${runName}Artifact") {
        group = 'verification'
        description = 'Copies a frozen release JAR into this disposable client before launch. Close this profile before replacing its artifact.'
        dependsOn(tasks.named('jar'))
        doLast {
            def source = tasks.named('jar', Jar).get().archiveFile.get().asFile
            def profile = file("runs/${folder}-${mod_version}")
            def destination = new File(profile, "mods/${source.name}")
            profile.mkdirs()
            def options = new File(profile, 'options.txt')
            def lines = options.exists() ? options.readLines('UTF-8') : ['renderDistance:8', 'simulationDistance:5', 'maxFps:60', 'guiScale:2']
            lines.removeAll { it.startsWith('version:') || it.startsWith('soundCategory_music:') || it.startsWith('onboardAccessibility:') }
            options.setText((['version:3955', 'soundCategory_music:0.15', 'onboardAccessibility:false'] + lines).join('\n') + '\n', 'UTF-8')
            if (destination.exists() && Arrays.equals(destination.bytes, source.bytes)) return
            if (destination.exists()) {
                def hash = java.security.MessageDigest.getInstance('SHA-256').digest(destination.bytes).encodeHex().toString()
                def history = new File(profile, "artifact-history/${source.name}-${hash.take(12)}")
                history.parentFile.mkdirs()
                if (history.exists()) {
                    if (!Arrays.equals(history.bytes, destination.bytes)) throw new GradleException('Frozen artifact history differs')
                } else java.nio.file.Files.copy(destination.toPath(), history.toPath())
            }
            destination.parentFile.mkdirs()
            java.nio.file.Files.copy(source.toPath(), destination.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
    tasks.matching { it.name == "run${runName}" }.configureEach { dependsOn(installer) }
}

def getManifestAttributes(String title, String artifactVersion) {
    return [
            'Specification-Title'     : title,
            'Specification-Vendor'    : 'MPS Re-modularized',
            'Specification-Version'   : artifactVersion,
            'Implementation-Title'    : title,
            'Implementation-Version'  : artifactVersion,
            'Implementation-Vendor'   : 'MPS Re-modularized',
            'Automatic-Module-Name'   : 'mpsremodularized'
    ]
}

