def verifyReleaseLayout = tasks.register('verifyReleaseLayout') {
    group = 'verification'
    description = 'Checks the single MPS artifact and reports publishing configuration without uploading.'
    dependsOn(tasks.named('jar'), outputChangelog)
    def reportFile = layout.buildDirectory.file('reports/consolidation/release-layout.json')
    outputs.file(reportFile)
    // Evaluate actual task wiring on every run, including changes to external publishing properties.
    outputs.upToDateWhen { false }
    def runtimeJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
    def archiveFiles = configurations.archives.artifacts.files
    def expectedVersion = "${minecraft_version}-${mod_version}".toString()
    def secondaryTasks = tasks.names.findAll { it.toLowerCase().startsWith('powersuits') }
    def changelogProvider = changelogFile
    def report = [group: project.group.toString(), version: project.version.toString(), artifact: runtimeJar.name,
                  sourceSets: sourceSets.names.sort(), archiveArtifacts: [runtimeJar.name],
                  curseforgeUploadEnabled: tasks.named('curseforge').get().enabled,
                  modrinthUploadEnabled: tasks.named('modrinth').get().enabled,
                  releaseType: release_type.toString(), separateLibraryArtifact: false]
    inputs.properties(report)
    doLast {
        assert report.group == 'mpsremodularized'
        assert report.version == expectedVersion
        assert runtimeJar.name == "MPS-Re-modularized-${expectedVersion}.jar"
        assert !report.sourceSets.contains('powersuits') && secondaryTasks.isEmpty()
        assert archiveFiles.files == [runtimeJar] as Set
        def changelog = changelogProvider.get().asFile.text
        assert changelog.contains("MPS Re-modularized ${mod_version}")
        assert !changelog.contains('mekanism/Mekanism') && !changelog.contains('Unable to generate changelog')
        def output = reportFile.get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
        logger.lifecycle('Single-artifact release layout checks passed')
    }
}
tasks.named('check') { dependsOn(verifyReleaseLayout) }
